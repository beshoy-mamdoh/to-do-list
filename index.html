<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        /* تأثير انيميشن لظهور العناصر */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body 
        {
            background-color: rgb(30,0,77);
            font-family: "Tajawal", sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .tasks-table 
        {
            width: 90%; /* متجاوب تلقائياً على الشاشات الصغيرة */
            max-width: 600px; /* لا يزيد عن هذا الحجم على الشاشات الكبيرة */
            background-color: rgb(239,239,239);
            margin-top: 50px;
            margin-bottom: 50px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        button
        {
            border: none;
            font-size: 17px;
            box-shadow: 0px 3px 5px rgba(168,168,168,0.38);
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }
        
        button:active {
            transform: scale(0.95); /* تأثير ضغطة الزرار */
        }

        button.circular
        {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            line-height: 0;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        
        .task
        {
            display: flex;
            background-color: white;
            padding: 10px;
            border-bottom: solid #eee 1px;
            transition: all 0.3s ease;
            margin-bottom: 8px;
            border-radius: 6px;
            align-items: center;
            justify-content: space-between;
            /* تطبيق تأثير الـ Keyframes عند إضافة مهمة جديدة */
            animation: fadeInUp 0.4s ease forwards;
        }
        
        .task:hover 
        {
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px); /* حركة خفيفة للأعلى عند التحويم */
        }
        
        .done {
            background-color: rgb(158, 253, 160) !important;
        }

        /* تعديل تجاوب الأزرار والنصوص داخل المهمة للأجهزة الصغيرة جداً */
        @media (max-width: 400px) {
            .task h2 {
                font-size: 18px;
            }
            button.circular {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
        }
    </style>

</head>
<body>
    <div style="direction: rtl;">
        <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 0 10px;">
            <div class="tasks-table">

                <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; color: white; padding: 15px 20px; background-color: rgb(92, 52,155); box-sizing: border-box;">
                    <h1 style="margin: 0; font-size: 24px;">مهامي</h1>
                    <button id="add-btn" class="circular" style="background-color: white;">
                        <span class="material-symbols-outlined">
                            add
                        </span>
                    </button>
                </div>
                <div id="tasks" style="padding: 15px; max-height: 70vh; overflow-y: auto;">
                    
                </div>
                </div>
            </div>
        </div>
</body>

<script>
    let now = new Date();
    let date = now.getDate() + " / " + (now.getMonth()+1) + " / " + now.getFullYear();
    let tasks = [
        {
            "title" : "مذاكره الكليه" ,
            "date"  : date  , 
            "isDone":   false   ,
        },
    ];

        function getDataFromStorage() {
            let re = JSON.parse(localStorage.getItem("tasks"))
            if ( re == null){
                tasks = []
            }
            else {[
                tasks = re
            ]}
        }
        getDataFromStorage()
    function fill() {
        let index =0 ;
        document.getElementById("tasks").innerHTML="";
        for(task of tasks)
        {
            
            var content =
            `<div class="task ${task.isDone ? 'done' : ''}">
                        <div style="width: 65%; padding-right:8px ;" >
                            <h2 style="margin: 5px 0;">${task.title}</h2>
                            <div style="font-size: 14px; color: #555;">
                                <i class="fa-solid fa-calendar-days"></i>
                                <span>${task.date}</span>
                            </div>
                        </div>
                        <div style="display: flex; justify-content: space-around; align-items: center; width: 35%;">
                            <button onclick="deleteTask(${index})" class="circular" style="background-color: rgb(114, 0, 0);  color: white;">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                            <button onclick="editTask(${index})" class="circular" style="background-color: rgb(0, 150, 30); color: white;">
                                <i class="fa-solid fa-arrow-rotate-right"></i>
                            </button>
                            ${task.isDone ? `
                            <button onclick="isdone(${index})" class="circular" style="background-color: rgb(118,0,101 ); color: white;">
                                <i class="fa-solid fa-circle-xmark"></i>    
                            </button>` : `
                            <button onclick="isdone(${index})" class="circular" style="background-color: rgb(0,16,197 , 0.692); color: white;">
                                <i class="fa-solid fa-check"></i>
                            </button>`}
                            
                        </div>
                        </div>
                    ` 
                
            document.getElementById("tasks").innerHTML+= content ;
            
            index ++
                
        }
    }
        fill();

    
        document.getElementById("add-btn").addEventListener("click" , function(){
            let taskName = prompt(" اكتب اسم المهمه يمعلم 😊") ;
            if (taskName=="" || taskName==null)
            {
                alert("سايبلي المهمه فاضيه ليه يمعلم 🙄")
            } else
            {
                let task = {
                    "title" : taskName ,
                    "date" : date ,
                    "isDone" : false ,
                } ; 
                tasks.push(task) ;
                storeTasks()
                fill();
            }
        })
        
        function deleteTask(index){
            let task =tasks[index]
            let con =confirm(" هل انت متاكد من حذف مهمه : " + task.title) ;
            if(con == true) {
                tasks.splice(index , 1)
                fill()
            }
            storeTasks()
        }

        function editTask (index) {
            let edit = prompt("برجاء تحديد عنوان المهمه الجديده ")
            let task = tasks[index]
            if (edit == null || edit == ""){
                
            }
            else {
                task.title = edit
                fill()
            }
            storeTasks()
        }

        function isdone (index){
            let task = tasks[index]
            if (task.isDone == true) {
                task.isDone = false
                fill()
            } 
            else {
                task.isDone = true
                fill()
            }
            storeTasks()
        }
        
        function storeTasks (){
            let taskString = JSON.stringify(tasks)
            localStorage.setItem("tasks" , taskString)
        }

</script>
</html>
